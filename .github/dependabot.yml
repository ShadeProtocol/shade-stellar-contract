version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: contrib
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /example
    target-branch: contrib
    schedule:
      interval: monthly
    groups:
      example-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: contrib
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
