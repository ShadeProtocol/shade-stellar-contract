name: Pre-commit Checks

on:
  pull_request:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"
  push:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"

jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # The clippy and cargo-check hooks build with the toolchain pinned in
      # rust-toolchain.toml; install it up front so the hooks don't pay for it.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Install pre-commit
        run: pip install pre-commit
      
      - name: Run pre-commit
        run: pre-commit run --all-files

