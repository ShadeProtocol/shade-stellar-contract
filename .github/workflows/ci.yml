name: CI

on:
  push:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"
  pull_request:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Installs the toolchain, components and targets pinned in
      # rust-toolchain.toml, so CI never floats on the latest stable.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Tests deploy the real account contract, so rebuild it from this commit.
      - name: Rebuild account fixture
        run: |
          if [ -f Makefile ] && grep -q '^fixtures:' Makefile; then
            make fixtures
          else
            echo "No 'fixtures' Makefile target found; skipping fixture rebuild."
          fi

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      # Installs the toolchain, components and targets pinned in
      # rust-toolchain.toml, so CI never floats on the latest stable.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Report contract sizes
        run: ls -l target/wasm32v1-none/release/*.wasm

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Measure optimized WASM sizes (head)
        run: .github/scripts/wasm-size.sh measure target/wasm32v1-none/release head-sizes.json

      - name: Build base branch for comparison (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git worktree add ../base FETCH_HEAD
          (cd ../base && cargo build --release --target wasm32v1-none)
          .github/scripts/wasm-size.sh measure ../base/target/wasm32v1-none/release base-sizes.json || true

      - name: Check WASM size budget
        run: |
          .github/scripts/wasm-size.sh check head-sizes.json \
            $([ -f base-sizes.json ] && echo base-sizes.json)

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      # Installs the toolchain, components and targets pinned in
      # rust-toolchain.toml, so CI never floats on the latest stable.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check
        run: cargo fmt --all -- --check
