name: Examples

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, contrib]
    paths:
      - "example/**"
      - "contracts/shade/**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  examples:
    name: Build and test examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build example workspace
        id: build
        continue-on-error: true
        working-directory: example
        run: cargo build --workspace

      - name: Test example workspace
        id: test
        continue-on-error: true
        working-directory: example
        run: cargo test --workspace

      - name: Test examples with Shade gateway modules
        id: from-shade
        continue-on-error: true
        working-directory: example
        run: cargo test --workspace --features from-shade

      - name: Report failures in the workflow summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FROM_SHADE_OUTCOME: ${{ steps.from-shade.outcome }}
        run: |
          {
            echo "### Example workspace checks"
            echo "- Build: ${BUILD_OUTCOME}"
            echo "- Tests: ${TEST_OUTCOME}"
            echo "- from-shade tests: ${FROM_SHADE_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the scheduled failure issue
        if: always() && github.event_name == 'schedule' && (steps.build.outcome == 'failure' || steps.test.outcome == 'failure' || steps.from-shade.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scheduled example workspace checks are failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled example workspace checks failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "This issue is updated by the scheduled Examples workflow. It can be closed after a later scheduled run passes."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated tracking issue #${existing.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo,
                title,
                body
              });
              core.info(`Created tracking issue #${issue.number}.`);
            }
