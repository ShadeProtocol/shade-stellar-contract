name: Docs Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "contracts/**/src/events.rs"
      - "contracts/**/src/errors.rs"
      - "scripts/check-reference-docs.sh"
      - "scripts/check_reference_docs.py"
      - "scripts/test_check_reference_docs.py"
      - "Makefile"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main, contrib]
    paths:
      - "docs/**"
      - "contracts/**/src/events.rs"
      - "contracts/**/src/errors.rs"
      - "scripts/check-reference-docs.sh"
      - "scripts/check_reference_docs.py"
      - "scripts/test_check_reference_docs.py"
      - "Makefile"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    name: Reference completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test reference checker
        run: python3 -m unittest discover -s scripts -p 'test_check_reference_docs.py' -v
      - name: Check events and errors references
        run: bash scripts/check-reference-docs.sh
